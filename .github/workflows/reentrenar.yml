# Reentrenamiento semanal del modelo v1: actualiza el histórico, entrena y publica modelos/
# en la rama `modelos` (un único commit que se sobrescribe cada semana, para que el repo no crezca).
# El envío diario usa el modelo de esa rama; si no existe, el de main.
name: Reentrenar modelo

on:
  schedule:
    - cron: "0 3 * * 1"   # cada lunes, 03:00 UTC (lejos del cutoff)
  workflow_dispatch:

permissions:
  contents: write

# Grupo propio: el reentrenamiento nunca debe retrasar un envío (solo escribe en la rama `modelos`)
concurrency:
  group: reentrenar
  cancel-in-progress: false

jobs:
  reentrenar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # El histórico se guarda en caché entre ejecuciones; solo se descarga lo nuevo
      - uses: actions/cache@v4
        with:
          path: data
          key: historico-${{ github.run_id }}
          restore-keys: historico-
      - run: python -m prevision.modelo entrenar
        env:
          ESIOS_API_KEY: ${{ secrets.ESIOS_API_KEY }}
      - run: python -m pytest -q
      - name: Publicar el modelo en la rama modelos
        run: |
          rm -rf /tmp/publicar && mkdir /tmp/publicar && cp -r modelos /tmp/publicar/
          cd /tmp/publicar
          git init -q -b modelos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modelos
          git commit -q -m "Modelo v1 entrenado el $(date -u +%Y-%m-%d)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" modelos
