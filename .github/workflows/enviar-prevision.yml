# Envío diario a Forecast Score.
# Cutoff: 12:45 Bruselas = 10:45 UTC en verano / 11:45 UTC en invierno.
# Varias ejecuciones por redundancia: los cron de GitHub pueden retrasarse horas (hemos visto 3 h)
# o saltarse, sobre todo a en punto, así que se usan minutos poco habituales:
#  - 17:17 UTC: envía el día de pasado mañana (ya hay datos), con un día entero de margen
#  - 04:23, 06:43, 08:13 y 09:37 UTC: reenvían el de mañana (solo puntúa la última versión)
# Si un job falla, GitHub manda un email al dueño del repositorio.
name: Enviar previsión

on:
  schedule:
    - cron: "17 17 * * *"
    - cron: "23 4 * * *"
    - cron: "43 6 * * *"
    - cron: "13 8 * * *"
    - cron: "37 9 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Día de entrega (YYYY-MM-DD). Vacío = próximo abierto"
        required: false

permissions:
  contents: write   # para guardar el registro de previsiones (corrección de sesgo)

concurrency:
  group: enviar-prevision
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Modelo más reciente (reentrenado cada semana en la rama `modelos`); si no hay, se usa el de main
      - name: Usar el modelo más reciente
        continue-on-error: true
        run: |
          git fetch -q --depth=1 origin modelos && git checkout FETCH_HEAD -- modelos/ \
            && python -c "import json; print('Modelo entrenado hasta', json.load(open('modelos/v1/meta.json'))['entrenado_hasta'])" \
            || (git checkout HEAD -- modelos/ && echo "Sin rama modelos: se usa el modelo de main")
      # v1 (modelo). Si falla el modelo, el propio script envía el benchmark y acaba en error (email)
      - name: Enviar v1
        id: v1
        continue-on-error: true
        env:
          FORECASTSCORE_API_KEY: ${{ secrets.FORECASTSCORE_API_KEY }}
        run: python enviar_prevision.py --version v1 ${{ inputs.fecha && format('--fecha {0}', inputs.fecha) || '' }}
      # Previsión a 15 minutos (ranking PT15M). Desactivada salvo que la variable del repositorio
      # ENVIAR_PT15M valga "true" (Settings → Secrets and variables → Actions → Variables)
      - name: Enviar v1 a 15 minutos
        id: v1_15
        if: vars.ENVIAR_PT15M == 'true'
        continue-on-error: true
        env:
          FORECASTSCORE_API_KEY: ${{ secrets.FORECASTSCORE_API_KEY }}
        run: python enviar_prevision.py --version v1 --resolucion PT15M ${{ inputs.fecha && format('--fecha {0}', inputs.fecha) || '' }}
      # Guarda la previsión sin corregir en registro/ (la usa la corrección de sesgo de los días siguientes)
      - name: Guardar registro
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registro/
          # solo se sube registro/ (el modelo traído de la rama `modelos` no va a main)
          git commit -q -m "Registro de previsiones ($(date -u +%Y-%m-%dT%H:%MZ))" -- registro/ || exit 0
          git reset -q --hard HEAD
          git pull --rebase -q && git push -q
      # Datos tal como estaban en este envío → rama `archivo` (un único commit con un fichero por día)
      - name: Guardar archivo de datos
        if: always()
        continue-on-error: true
        run: |
          [ -d archivo ] || { echo "Nada que archivar"; exit 0; }
          rm -rf /tmp/archivo && mkdir /tmp/archivo && cd /tmp/archivo
          git init -q -b archivo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth=1 "$URL" archivo; then git checkout -q FETCH_HEAD -- . ; fi
          mkdir -p archivo && cp "$GITHUB_WORKSPACE"/archivo/*.parquet archivo/
          git add archivo
          git commit -q -m "Archivo de datos ($(date -u +%Y-%m-%dT%H:%MZ)): $(ls archivo | wc -l) días"
          git push -q --force "$URL" archivo
          echo "Archivo: $(ls archivo | wc -l) días, $(du -sh archivo | cut -f1)"
      # Los tests van después del envío: si fallan, avisan, pero no impiden enviar
      - run: python -m pytest -q
      - name: Marcar el job como fallido si el envío falló o usó el respaldo (para recibir el email)
        if: steps.v1.outcome == 'failure' || steps.v1_15.outcome == 'failure'
        run: exit 1
